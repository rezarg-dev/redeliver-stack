name: redeliver

# Settings shared by every long-running service.
x-common: &common
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# The app image is also used by the demo services, so its build
# definition is shared.
x-app-build: &app-build
  context: ./app
  additional_contexts:
    # The application lives in its own repository. BuildKit fetches it at
    # build time; REDELIVER_REF selects a branch, tag or commit.
    source: https://github.com/rezarg-dev/redeliver.git#${REDELIVER_REF:-main}

services:
  app:
    <<: *common
    build: *app-build
    image: redeliver:local
    init: true
    read_only: true
    environment:
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - admin_token
    volumes:
      - app-data:/data
    networks:
      - backend
      - monitoring
    # On SIGTERM the app waits up to 15 s for deliveries that are in flight.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  proxy:
    <<: *common
    image: nginxinc/nginx-unprivileged:1.27-alpine
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Public: webhook ingest only.
      - "${PUBLIC_PORT:-8080}:8080"
      # Admin API: reachable from this machine only.
      - "127.0.0.1:${ADMIN_PORT:-8081}:8081"
    networks:
      - edge
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.2
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - edge
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    <<: *common
    image: grafana/grafana:12.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/redeliver.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - edge
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # --- "demo" profile: a fake destination and a traffic generator --------

  receiver:
    <<: *common
    profiles: [demo]
    build: *app-build
    image: redeliver:local
    read_only: true
    # Answers the first three requests with 503 to show retries.
    command: ["node", "scripts/receiver.js", "--port", "9000", "--fail", "3"]
    healthcheck:
      disable: true
    networks:
      - backend

  traffic:
    <<: *common
    profiles: [demo]
    build: *app-build
    image: redeliver:local
    read_only: true
    command: ["node", "/demo/traffic.js"]
    environment:
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      APP_URL: http://app:3000
      RECEIVER_URL: http://receiver:9000/hook
    secrets:
      - admin_token
    volumes:
      - ./demo/traffic.js:/demo/traffic.js:ro
    healthcheck:
      disable: true
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
      receiver:
        condition: service_started

  # --- "tools" profile: one-shot jobs, started with "docker compose run" --

  backup:
    profiles: [tools]
    build: ./backup
    image: redeliver-backup:local
    environment:
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - app-data:/data
      - ./backups:/backups
    network_mode: none

networks:
  # Services with a published port.
  edge:
  # proxy <-> app. Not internal, because the app has to reach destinations
  # on the internet.
  backend:
  # Metrics only. Containers cannot reach the outside through this network.
  monitoring:
    internal: true

volumes:
  app-data:
  prometheus-data:
  grafana-data:

secrets:
  admin_token:
    file: ./secrets/admin_token
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
