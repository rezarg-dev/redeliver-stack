name: redeliver

services:
  app:
    build:
      context: ./app
      additional_contexts:
        # The application lives in its own repository. BuildKit fetches it
        # at build time; REDELIVER_REF selects a branch, tag or commit.
        source: https://github.com/rezarg-dev/redeliver.git#${REDELIVER_REF:-main}
    image: redeliver:local
    init: true
    restart: unless-stopped
    environment:
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets:
      - admin_token
    volumes:
      - app-data:/data

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Public: webhook ingest only.
      - "${PUBLIC_PORT:-8080}:8080"
      # Admin API: reachable from this machine only.
      - "127.0.0.1:${ADMIN_PORT:-8081}:8081"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  app-data:

secrets:
  admin_token:
    file: ./secrets/admin_token
