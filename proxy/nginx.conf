# The unprivileged nginx image runs as a normal user on a read-only root
# filesystem, so everything nginx writes at runtime goes to /tmp (a tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  log_format main '$remote_addr [$time_iso8601] "$request" $status '
                  '$body_bytes_sent bytes ${request_time}s';
  access_log /dev/stdout main;

  server_tokens off;
  default_type application/json;

  # At most 20 requests per second per client address, with room for a
  # short burst. Senders that go over the limit get 429 and retry later.
  limit_req_zone $binary_remote_addr zone=ingest:10m rate=20r/s;
  limit_req_status 429;

  # nginx resolves a host name in "proxy_pass http://app:3000" once, at
  # startup, and keeps that address for as long as it runs. A recreated app
  # container can come back with a different address, and every request
  # would then end in a 502 until the proxy is restarted. Putting the
  # address in a variable makes nginx ask Docker's DNS server again, at
  # most every ten seconds.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;

  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 3s;
  proxy_read_timeout    15s;

  # Public listener. The only thing the outside world may do is deliver
  # webhooks. The admin API, the health check and the metrics endpoint are
  # not reachable from here.
  server {
    listen 8080;
    set $app http://app:3000;

    # Same limit as the app's MAX_BODY_BYTES, so oversized requests are
    # turned away before they reach it.
    client_max_body_size 256k;

    location /in/ {
      limit_req zone=ingest burst=40 nodelay;
      proxy_pass $app;
    }

    location / {
      return 404 '{"error":"not_found","message":"Nothing here"}\n';
    }
  }

  # Admin listener. compose.yaml publishes this port on 127.0.0.1 only.
  server {
    listen 8081;
    set $app http://app:3000;

    # Answered by nginx itself: used as the container health check.
    location = /proxy-health {
      access_log off;
      return 200 '{"status":"ok"}\n';
    }

    location = /healthz {
      proxy_pass $app;
    }

    location /api/ {
      proxy_pass $app;
    }

    location / {
      return 404 '{"error":"not_found","message":"Nothing here"}\n';
    }
  }
}
